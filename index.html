<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Notes App</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <div class="app">
        <header>
          <h1>My Notes</h1>
          <p>Capture your thoughts and ideas</p>
        </header>

        <form class="note-form" id="noteForm">
          <label class="visually-hidden" for="noteTitle">Note title</label>
          <input
            type="text"
            id="noteTitle"
            placeholder="Note title"
            required
            maxlength="120"
          />

          <label class="visually-hidden" for="noteContent">Note content</label>
          <textarea
            id="noteContent"
            placeholder="Write your note..."
            rows="5"
            required
            maxlength="5000"
          ></textarea>

          <button id="addNoteBtn" type="submit">Add Note</button>
        </form>

        <section class="notes-section">
          <div class="notes-header">
            <h2>My Notes</h2>

            <label class="visually-hidden" for="searchInput">Search notes</label>
            <input
              type="text"
              id="searchInput"
              placeholder="Search notes..."
            />

            <span id="noteCount" aria-live="polite">0 notes</span>
          </div>

          <div id="notesContainer" class="notes-container">
            <div class="empty-message">
              No notes yet. Create your first note!
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
